name: Affiliate validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-affiliate-test-only
          POSTGRES_DB: btg_affiliate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btg_affiliate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-affiliate-test-only@127.0.0.1:5432/btg_affiliate_test
      JWT_SECRET: affiliate-ci-test-secret-at-least-32-characters
      AFFILIATE_TEST_DATABASE_URL: postgresql://postgres:local-affiliate-test-only@127.0.0.1:5432/btg_affiliate_test
      ALLOW_AFFILIATE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm test
      - run: npm run prisma:deploy
      - run: npm run test:postgres
      - run: npm run typecheck
      - run: npm run build
